<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certificate Analyzer — JavaScript Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/node-forge@1.3.1/dist/forge.min.js"></script>
  <script src="../assets/js/tools.js" defer></script>
  <script src="../assets/js/menu.js" defer></script>
  <script src="../assets/js/export.js" defer></script>
  <script src="./certificate-analyzer.js" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="max-w-6xl mx-auto px-6 py-5 flex items-center justify-between">
      <h1 class="text-2xl brand">
        <a href="../index.html">JavaScript Tools</a>
      </h1>
      <nav id="top-menu" class="space-x-5 text-sm"></nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-6 py-12">
    <div class="animate-in mb-8">
      <span class="badge" style="background: rgba(79, 70, 229, 0.12); color: #4338ca;">Sécurité</span>
      <h2 class="page-title mt-3">Certificate Analyzer</h2>
      <p class="page-subtitle mt-3">
        Collez un certificat au format PEM/CRT pour en extraire toutes les informations.
        L'analyse de l'<strong>EKU</strong> (Extended Key Usage) est mise en évidence.
      </p>
    </div>

    <section class="card animate-in">
      <label class="block text-sm font-semibold mb-2" for="cert-input">Certificat PEM</label>
      <textarea
        id="cert-input"
        rows="10"
        class="field field-mono"
        placeholder="-----BEGIN CERTIFICATE-----&#10;...&#10;-----END CERTIFICATE-----"
      ></textarea>

      <div class="mt-4 flex flex-wrap gap-2 items-center">
        <button id="analyze-btn" type="button" class="btn btn-primary">Analyser</button>
        <button id="example-btn" type="button" class="btn btn-ghost">Charger un exemple</button>
        <button id="clear-btn" type="button" class="btn btn-ghost">Effacer</button>
        <button id="download-html" type="button" class="btn btn-accent ml-auto">
          Télécharger (HTML autonome)
        </button>
      </div>

      <div id="error" class="hidden alert alert-error mt-4"></div>
    </section>

    <section id="result" class="hidden card mt-8 animate-in"></section>
  </main>

  <footer class="app-footer">JavaScript Tools · Certificate Analyzer</footer>
</body>
</html>
